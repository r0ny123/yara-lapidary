name: discover

on:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:
    inputs:
      max_queries:
        description: How many of the search queries to run
        default: "20"
      max_candidates:
        description: How many hits to resolve, compile and score
        default: "40"

permissions: {}

concurrency:
  group: discover
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-yara-x

      - name: Search and store new rules
        env:
          # Code search needs a user token; the Actions token may be refused.
          # Store a fine-grained PAT with public-repository read as DISCOVERY_TOKEN.
          GH_TOKEN: ${{ secrets.DISCOVERY_TOKEN || github.token }}
          MAX_QUERIES: ${{ github.event.inputs.max_queries || '20' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '40' }}
        run: |
          set -euo pipefail
          [[ "$MAX_QUERIES" =~ ^[0-9]+$ && "$MAX_CANDIDATES" =~ ^[0-9]+$ ]]
          python3 scripts/discover.py --max-queries "$MAX_QUERIES" --max-candidates "$MAX_CANDIDATES"
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request with the new rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add rules/ discovery/seen.txt
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          day=$(date -u +%F)
          branch="discovery/${day}-${GITHUB_RUN_ID}"
          title="New rules ${day} ($(git diff --cached --name-only -- rules/ | wc -l))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title"
          git push -u origin "$branch"
          gh pr create --title "$title" --body-file report/summary.md --base main --head "$branch" \
            || gh issue create --title "$title" --body "Actions may not open pull requests here; branch ${branch} holds the rules."
