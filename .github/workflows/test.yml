name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-yara-x

      - name: Verify entries point at upstream repositories, pinned
        env:
          # A user token (DISCOVERY_TOKEN) can read gists; the Actions token cannot, and the
          # anonymous fallback shares the runner's exhausted quota. Unverifiable entries warn.
          GH_TOKEN: ${{ secrets.DISCOVERY_TOKEN || github.token }}
        run: python3 scripts/origin.py verify

      - name: Fetch indexed sources
        run: python3 scripts/fetch.py

      - name: Check with YARA-X
        id: check
        run: python3 scripts/check.py
        continue-on-error: true

      - name: Publish report
        if: always()
        run: |
          if [ -f report/REPORT.md ]; then cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No report produced; see the failing step." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report
          path: report/
          retention-days: 30

      - name: Fail on regressions
        if: steps.check.outcome == 'failure'
        run: exit 1
