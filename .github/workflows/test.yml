name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  YARA_X_VERSION: "1.21.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YARA-X CLI
        run: |
          set -euo pipefail
          url="https://github.com/VirusTotal/yara-x/releases/download/v${YARA_X_VERSION}/yara-x-v${YARA_X_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" -o yr.tar.gz
          tar -xzf yr.tar.gz
          install -m 0755 "$(find . -maxdepth 3 -type f -name yr | head -1)" /usr/local/bin/yr
          yr --version

      - name: Fetch indexed sources
        run: python3 scripts/fetch.py

      - name: Check with YARA-X
        id: check
        run: python3 scripts/check.py
        continue-on-error: true

      - name: Publish report
        if: always()
        run: cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report/

      - name: Fail on regressions
        if: steps.check.outcome == 'failure'
        run: exit 1
